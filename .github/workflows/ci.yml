name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build Docker image
        env:
          IMAGE_TAG: git-happens-frontend:${{ github.sha }}
        run: docker build --tag "$IMAGE_TAG" .

      - name: Save Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save git-happens-frontend:${{ github.sha }} | gzip > git-happens-frontend.tar.gz

      - name: Upload Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: git-happens-frontend-image
          path: git-happens-frontend.tar.gz

  push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: git-happens-frontend-image

      - name: Load Docker image
        run: gunzip -c git-happens-frontend.tar.gz | docker load

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: acraiacademy26.azurecr.io
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}
      - name: Push Docker image
        env:
          IMAGE: acraiacademy26.azurecr.io/git-happens-frontend
          LOCAL_IMAGE: git-happens-frontend:${{ github.sha }}
          SHA_TAG: acraiacademy26.azurecr.io/git-happens-frontend:${{ github.sha }}
        run: |
          docker tag "$LOCAL_IMAGE" "$SHA_TAG"
          docker push "$SHA_TAG"
          docker tag "$SHA_TAG" "$IMAGE:latest"
          docker push "$IMAGE:latest"

  terraform:
    needs: test
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.6.0"

      - name: Terraform Format Check
        working-directory: infrastructure
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: infrastructure
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Terraform Validate
        working-directory: infrastructure
        run: terraform validate

      - name: Terraform Plan
        working-directory: infrastructure
        run: terraform plan -input=false -var-file="terraform.dev.tfvars" -out=tfplan

      - name: Terraform Apply (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: infrastructure
        run: terraform apply -input=false -auto-approve tfplan


